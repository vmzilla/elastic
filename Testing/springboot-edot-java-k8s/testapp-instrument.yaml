# Spring Boot app instrumented with the EDOT Java agent (no OpenTelemetry Operator).
# An init container copies the agent jar from the EDOT Java image into a shared volume;
# JAVA_TOOL_OPTIONS attaches it to the JVM. The OTLP auth header comes from the Secret
# defined in otel-apm-auth-secret.yaml (create that first).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testapp-instrument
  namespace: default
  labels:
    app: testapp-instrument
spec:
  replicas: 1
  selector:
    matchLabels:
      app: testapp-instrument
  template:
    metadata:
      labels:
        app: testapp-instrument
    spec:
      volumes:
        - name: otel-agent
          emptyDir: {}
      initContainers:
        - name: copy-edot-java-agent
          image: docker.elastic.co/observability/elastic-otel-javaagent:1.14.0
          command: ["cp", "/javaagent.jar", "/otel-agent/javaagent.jar"]
          volumeMounts:
            - name: otel-agent
              mountPath: /otel-agent
      containers:
        - name: testapp-instrument
          image: springio/gs-spring-boot-docker:latest
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: otel-agent
              mountPath: /otel-agent
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/otel-agent/javaagent.jar"
            - name: OTEL_SERVICE_NAME
              value: testapp-instrument
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "<your-otlp-endpoint>"   # e.g. https://<id>.ingest.<region>.<csp>.elastic-cloud.com:443
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: otel-apm-auth
                  key: OTEL_EXPORTER_OTLP_HEADERS
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: testapp-instrument
  namespace: default
spec:
  selector:
    app: testapp-instrument
  ports:
    - port: 8080
      targetPort: 8080
