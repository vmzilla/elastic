# Secret holding the OTLP auth header used by testapp-instrument.yaml.
# Replace the placeholder with your own base64 API key before applying.
# Do NOT commit a real key. Alternatively create it without a file:
#   kubectl create secret generic otel-apm-auth \
#     --from-literal=OTEL_EXPORTER_OTLP_HEADERS='Authorization=ApiKey <base64_api_key>'
apiVersion: v1
kind: Secret
metadata:
  name: otel-apm-auth
  namespace: default
type: Opaque
stringData:
  OTEL_EXPORTER_OTLP_HEADERS: "Authorization=ApiKey <base64_api_key>"
