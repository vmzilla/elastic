# Elastic Agent in OTel mode (EDOT Collector) as a gateway.
# Start with:  docker compose --env-file collector.env up -d     (or: npm run collector:up)
services:
  otel-collector:
    image: ${COLLECTOR_IMAGE:-docker.elastic.co/elastic-agent/elastic-agent:9.4.2}
    container_name: otel-collector
    restart: unless-stopped
    command: ["--config", "/etc/otelcol-config.yml"]
    ports:
      - "4317:4317"   # OTLP/gRPC
      - "4318:4318"   # OTLP/HTTP
    volumes:
      - ./otel-collector-config.yml:/etc/otelcol-config.yml:ro
    environment:
      - ELASTIC_AGENT_OTEL=true
      - ELASTIC_ENDPOINT
      - ELASTIC_API_KEY
      - STORAGE_DIR=/usr/share/elastic-agent
    deploy:
      resources:
        limits:
          memory: 1.5G
